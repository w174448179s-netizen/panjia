<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>盘家 · 门店经营系统</title>
    <meta name="description" content="盘家房地产中介管理系统">
    <link href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link href="../static/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}" rel="stylesheet"/>
    <link href="../static/css/style.min.css" th:href="@{/css/style.min.css}" rel="stylesheet"/>
    <link href="../static/css/login.min.css" th:href="@{/css/login.min.css}" rel="stylesheet"/>
    <link href="../static/panjia/css/panjia-ui.css" th:href="@{/panjia/css/panjia-ui.css?v=4.8.3}" rel="stylesheet"/>
    <!-- 360浏览器急速模式 -->
    <meta name="renderer" content="webkit">
    <!-- 避免IE使用兼容模式 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="../static/favicon.ico" th:href="@{favicon.ico}"/>
    <style type="text/css">
      *{box-sizing:border-box;margin:0;padding:0;}
      html,body{background:none!important;}
      label.error { position:inherit; color:#ff9e6b; font-size:12px; }
      body.signin{
        font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
        background:linear-gradient(150deg,#0b0f19 0%,#111827 45%,#1a2332 100%)!important;
        color:#f3f4f6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 18px;
      }
      .signinpanel{background:none!important;max-width:none!important;}
      .signinpanel .row{margin:0;padding:0;}
      .signin-info{display:none!important;}
      .signup-footer{display:none!important;}
      .wrap{width:100%;max-width:400px;margin:auto;}
      /* 品牌区 */
      .brand{text-align:center;margin-bottom:30px;}
      .logo{width:72px;height:72px;margin:0 auto 16px;box-shadow:0 10px 30px rgba(255,90,0,.35);border-radius:18px;overflow:hidden;background:#111827;display:flex;align-items:center;justify-content:center;}
      .name{font-size:30px;font-weight:800;letter-spacing:1px;color:#f3f4f6;}
      .name .en{font-size:13px;color:#9ca3af;font-weight:400;letter-spacing:3px;display:block;margin-top:6px;}
      .slogan{margin-top:12px;font-size:14px;color:#ff9e6b;letter-spacing:1px;}
      .ver{margin-top:8px;font-size:11px;color:#4b5563;letter-spacing:1px;}
      /* 登录卡 */
      .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px 22px;backdrop-filter:blur(6px);}
      .card h4.no-margins{display:none;}
      .card p.m-t-md{display:none;}
      .field{margin-bottom:16px;}
      .field .lab{font-size:12px;color:#9ca3af;margin-bottom:6px;}
      .field input[type=text],
      .field input[type=password]{width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:11px 13px;color:#fff;font-size:14px;outline:none;box-shadow:none;height:auto;line-height:1.5;}
      .field input:focus{border-color:#ff5a00;background:rgba(0,0,0,.35);}
      .field input::placeholder{color:#6b7280;}
      .captcha-row{display:flex;gap:10px;align-items:center;}
      .captcha-row .code-wrap{flex:1;}
      .captcha-row .img-wrap{flex:0 0 auto;}
      .captcha-row img.imgcode{width:110px;height:42px;border-radius:9px;border:1px solid rgba(255,255,255,.15);cursor:pointer;background:#fff;object-fit:cover;}
      .row-x{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9ca3af;margin-bottom:18px;}
      .row-x a{color:#ff9e6b;text-decoration:none;}
      .row-x label{font-weight:normal;color:#9ca3af;cursor:pointer;}
      .btn-login{width:100%;background:linear-gradient(135deg,#ff5a00,#ff8a3d)!important;color:#fff;border:none!important;border-radius:9px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:2px;box-shadow:none!important;line-height:1.5;height:auto;}
      .btn-login:hover,.btn-login:focus,.btn-login:active{background:linear-gradient(135deg,#ff7a2e,#ffa15f)!important;color:#fff;}
      .scan{margin-top:14px;text-align:center;font-size:12px;color:#9ca3af;}
      .scan b{color:#cbd5e1;}
      .divider{display:flex;align-items:center;gap:10px;margin:20px 0 0;color:#6b7280;font-size:11px;}
      .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1);}
    </style>
    <script>
        if(window.top!==window.self){alert('未登录或登录超时。请重新登录');window.top.location=window.location};
    </script>
</head>
<body class="signin">
    <div class="wrap">

      <!-- 品牌区 -->
      <div class="brand">
        <div class="logo">
          <svg width="58" height="58" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="96" fill="#ff5a00"/>
            <path d="M52 112 L100 70 L148 112" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="100" y1="112" x2="100" y2="150" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
            <line x1="68" y1="112" x2="68" y2="150" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
            <line x1="132" y1="112" x2="132" y2="150" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="name">盘家<span class="en">PANJIA · 门店经营系统</span></div>
        <div class="slogan">把店上的事，盘得明明白白</div>
        <div class="ver">本地部署 · 数据不出店</div>
      </div>

      <!-- 登录卡 -->
      <div class="card">
        <form id="signupForm" autocomplete="off">
          <h4 class="no-margins">登录：</h4>
          <p class="m-t-md">盘家管理 - 专业的房地产中介管理平台</p>
          <div class="field">
            <div class="lab">账号</div>
            <input type="text" name="username" class="uname" placeholder="手机号 / 姓名" value="admin">
          </div>
          <div class="field">
            <div class="lab">口令</div>
            <input type="password" name="password" class="pword" placeholder="请输入口令" value="admin123">
          </div>
          <div class="field" th:if="${captchaEnabled==true}">
            <div class="lab">验证码</div>
            <div class="captcha-row">
              <div class="code-wrap">
                <input type="text" name="validateCode" class="form-control code" placeholder="验证码" maxlength="5">
              </div>
              <div class="img-wrap">
                <a href="javascript:void(0);" title="点击更换验证码">
                  <img th:src="@{/captcha/captchaImage(type=${captchaType})}" class="imgcode" alt="验证码">
                </a>
              </div>
            </div>
          </div>
          <div class="row-x" th:if="${isRemembered}">
            <span><label><input type="checkbox" id="rememberme" name="rememberme" style="vertical-align:middle;margin-right:4px;"> 记住我</label></span>
            <a href="javascript:void(0);" onclick="$.modal.msg('请联系系统管理员重置口令');">忘记口令？</a>
          </div>
          <div class="row-x" th:unless="${isRemembered}" th:if="${captchaEnabled==false}">
            <span>&nbsp;</span>
            <a href="javascript:void(0);" onclick="$.modal.msg('请联系系统管理员重置口令');">忘记口令？</a>
          </div>
          <button type="submit" class="btn-login" id="btnSubmit" data-loading="正在验证登录，请稍候...">登 录</button>
          <div class="scan">或 <b>企微 / 钉钉 扫码登录</b></div>
        </form>
      </div>

    </div>
<script th:inline="javascript"> var ctx = [[@{/}]]; var captchaType = [[${captchaType}]]; var captchaEnabled = [[${captchaEnabled}]];</script>
<!--[if lte IE 8]><script>window.location.href=ctx+'html/ie.html';</script><![endif]-->
<!-- 全局js -->
<script src="../static/js/jquery.min.js" th:src="@{/js/jquery.min.js}"></script>
<script src="../static/ajax/libs/validate/jquery.validate.min.js" th:src="@{/ajax/libs/validate/jquery.validate.min.js}"></script>
<script src="../static/ajax/libs/layer/layer.min.js" th:src="@{/ajax/libs/layer/layer.min.js}"></script>
<script src="../static/ajax/libs/blockUI/jquery.blockUI.js" th:src="@{/ajax/libs/blockUI/jquery.blockUI.js}"></script>
<script src="../static/panjia/js/panjia-ui.js" th:src="@{/panjia/js/panjia-ui.js?v=4.8.3}"></script>
<script src="../static/panjia/login.js" th:src="@{/panjia/login.js}"></script>
</body>
</html>
