# 项目相关配置
panjia:
  # 名称
  name: PanJia
  # 版本
  version: 0.1.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/panjia/uploadPath，Linux配置 /home/panjia/uploadPath）
  profile: /Users/shengwei/workspace
  # 获取ip地址开关
  addressEnabled: false
  # 数据库备份/恢复
  dbbackup:
    # 备份文件存放目录，默认= ${panjia.profile}/dbbackup
    backupDir:
    # Postgres 所在 Docker 容器名（默认 panjia-postgres），留空则使用宿主机 pg_dump/psql
    dockerContainer: panjia-postgres
    # Docker 容器内临时中转目录
    containerTmpDir: /tmp/panjia_db_backup
    # 最大保留备份数，超过自动清理最旧
    maxKeep: 30

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # ===== gzip 压缩：花生壳仅 1Mbps，140KB JS/大页面必须压缩（文本类可减 70%+） =====
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    # 1KB 起压：小响应压缩得不偿失，大响应（SDK/首页 JS/CSS）全兜住
    min-response-size: 1KB
  # 反向代理（花生壳/ngrok/Nginx）转发头处理：用 X-Forwarded-Proto/X-Forwarded-Host 还原原始 scheme+host
  # 否则 Tomcat 用「代理→应用」这一跳的 http://localhost:8080 拼重定向 Location，导致 https 丢失
  forward-headers-strategy: native
  tomcat:
    # ===== 访问日志：仅排障时临时开启（会记录每个请求的 Cookie，日常关闭避免敏感信息落盘）=====
    # 排障开启时建议 pattern 加 cookie=[%{Cookie}i]
    accesslog:
      enabled: false
      directory: logs/access
      pattern: '%h %t "%r" %s %b %Dms %{User-Agent}i'
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
 
# 日志配置
logging:
  level:
    com.panjia: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

# Spring配置
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 模板引擎
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: static/i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（备份 zip 可能较大）
      max-file-size: 2GB
      # 设置总上传的文件大小
      max-request-size: 2GB

# MyBatis
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.panjia.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: false
    # 验证码类型 math 数字计算 char 字符验证
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）Base64.encodeToString(CipherUtils.generateNewKey(128, "AES").getEncoded()) （默认启动生成随机秘钥，随机秘钥会导致之前客户端RememberMe Cookie无效，如设置固定秘钥RememberMe Cookie则有效）
    # 【重要】盘家已配置固定值：重启后「记住我」不会失效；不要在生产环境随意更换此值，更换会让所有用户的 rememberMe cookie 一次性失效
    cipherKey: 3AvVhmFLUs0KTA3Kprsdag==
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false
  rememberMe:
    # 是否开启记住我
    enabled: true

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 防止csrf攻击
csrf:
  # 过滤开关
  enabled: false
  # 白名单（多个用逗号分隔）
  whites: /druid